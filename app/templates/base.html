<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>E-Commerce Recommender</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.index') }}">E-Commerce Recommender</a>
    <form class="d-flex ms-auto" action="{{ url_for('main.search') }}" method="get">
      <input class="form-control me-2 form-control-lg search-input-lg" name="q" type="search" placeholder="Search products..." value="{{ request.args.get('q','') }}">
      <button class="btn btn-primary btn-lg" type="submit">Search</button>
    </form>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
